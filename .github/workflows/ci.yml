name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      audio-lab-backend: ${{ steps.filter.outputs.audio-lab-backend }}
      audio-lab-frontend: ${{ steps.filter.outputs.audio-lab-frontend }}
      cv-explorer: ${{ steps.filter.outputs.cv-explorer }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            audio-lab-backend:
              - 'tools/audio-lab/backend/**'
              - 'tools/audio-lab/Cargo.toml'
              - 'tools/audio-lab/Cargo.lock'
              - 'tools/audio-lab/Makefile'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            audio-lab-frontend:
              - 'tools/audio-lab/frontend/**'
              - 'tools/audio-lab/Makefile'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            cv-explorer:
              - 'tools/cv-explorer/worker/**'
              - 'tools/cv-explorer/web/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  audio-lab-backend:
    needs: changes
    if: ${{ needs.changes.outputs.audio-lab-backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/audio-lab
      - name: Run CI checks
        run: make -C tools/audio-lab ci-backend 2>&1 | tee ci-output.txt
      - name: Job summary
        if: always()
        run: |
          echo "## Audio Lab Backend" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rustc --version >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci-output.txt ]; then
            echo "### Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^test result:|^running' ci-output.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  audio-lab-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.audio-lab-frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/audio-lab/frontend/.nvmrc
          cache: npm
          cache-dependency-path: tools/audio-lab/frontend/package-lock.json
      - run: npm ci
        working-directory: tools/audio-lab/frontend
      - run: make -C tools/audio-lab ci-frontend
      - name: Job summary
        if: always()
        run: |
          echo "## Audio Lab Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --version >> "$GITHUB_STEP_SUMMARY"
          npm --version >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  cv-explorer:
    needs: changes
    if: ${{ needs.changes.outputs.cv-explorer == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/cv-explorer/worker/package-lock.json
            tools/cv-explorer/web/package-lock.json
      - run: npm ci
        working-directory: tools/cv-explorer/worker
      - run: npm ci
        working-directory: tools/cv-explorer/web
      - run: make ci-cv-explorer
      - name: Job summary
        if: always()
        run: |
          echo "## Common Voice Explorer" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node --version >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
