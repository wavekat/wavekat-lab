[project]
name = "wkst"
version = "0.0.1"
description = "Smart-turn training pipeline wheel — non-interactive CLI for the notebooks/smart-turn workflow."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Heavy deps — only needed for `wk-st run` / `wk-st export`.
# Mirrors the notebooks' `smart-turn` extras group.
train = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "soundfile>=0.12",
    "librosa>=0.10",
    "datasets>=3.0,<4.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.45",
    "accelerate>=1.1",
    # `wk-st export` — ONNX FP32 + INT8 quantize + bench
    "onnx>=1.17",
    "onnxruntime>=1.20",
]
dev = [
    "pytest>=8.0",
    # bootstrap CIs and continuation-recall live in wkst.metrics —
    # tests need numpy + sklearn but not torch.
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.scripts]
wk-st = "wkst.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wkst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
